<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>funda-search · activity</title>
<style>
body{margin:0;background:#f7f8fa;color:#25313b;font:14px -apple-system,system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:20px;margin:0}nav{display:flex;gap:16px}a{color:#0071b3}a[aria-current]{font-weight:700;color:#25313b} .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input,select,button{font:inherit;padding:8px;border:1px solid #cbd2d8;border-radius:5px}input{flex:1;min-width:180px}button{cursor:pointer;background:white}#status{color:#62717e;font-size:13px}#entries{background:white;border:1px solid #dbe0e5;border-radius:8px;overflow:hidden}.entry{display:grid;grid-template-columns:165px 55px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid #edf0f2}.entry:last-child{border:0}.message{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}time{color:#62717e;font-size:12px}.level{font-size:11px;text-transform:uppercase;color:#62717e}.error{background:#fff5f4}.error .level{color:#ac312a}.empty{padding:24px;color:#62717e}@media(max-width:650px){.entry{grid-template-columns:1fr 55px}.message{grid-column:1/-1}header,main{padding:14px}}
</style></head><body>
<header><h1>funda-search</h1><nav aria-label="View"><a href="overview.html">table</a><a href="map.html">map</a><a href="activity.html" aria-current="page">activity</a></nav></header>
<main><h2>Backend activity</h2><p>Recent work, newest first. Up to 500 messages, retained across restarts.</p>
<div class="controls"><input id="search" aria-label="Search activity" placeholder="Search activity…"><select id="level" aria-label="Message level"><option value="all">All messages</option><option value="error">Errors</option></select><button id="pause">Pause updates</button><button id="refresh">Refresh</button></div>
<p id="status" role="status">Loading activity…</p><div id="entries"></div></main>
<script>
let entries=[],paused=false,busy=false;
const $=id=>document.getElementById(id);
function render(){const q=$('search').value.toLowerCase(),level=$('level').value;const rows=entries.filter(e=>(level==='all'||e.level===level)&&e.message.toLowerCase().includes(q));const fragment=document.createDocumentFragment();for(const e of rows){const row=document.createElement('div');row.className='entry '+(e.level==='error'?'error':'');const time=document.createElement('time');time.dateTime=e.at;time.textContent=new Date(e.at).toLocaleString();const tag=document.createElement('span');tag.className='level';tag.textContent=e.level;const message=document.createElement('div');message.className='message';message.textContent=e.message;row.append(time,tag,message);fragment.append(row);}if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=entries.length?'No matching messages.':'No activity recorded yet.';fragment.append(empty);}$('entries').replaceChildren(fragment);}
async function refresh(){if(busy)return;busy=true;try{const response=await fetch('activity.json',{cache:'no-store'});if(!response.ok||!(response.headers.get('content-type')||'').includes('application/json'))throw new Error('Could not load activity. Your session may have expired; reload to sign in.');const data=await response.json();entries=data.entries;render();$('status').textContent=(paused?'Updates paused. ':'Updates every 5 seconds. ')+'Last loaded '+new Date().toLocaleTimeString();}catch(e){$('status').textContent=e.message;}finally{busy=false;}}
$('search').addEventListener('input',render);$('level').addEventListener('change',render);$('refresh').addEventListener('click',refresh);$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Resume updates':'Pause updates';$('status').textContent=paused?'Updates paused.':'Resuming…';if(!paused)refresh();});setInterval(()=>{if(!paused&&!document.hidden)refresh();},5000);refresh();
</script></body></html>
